# Configuration for the TMS compliance adapter subsystem.
# All values are placeholders for the skeleton; production deployments override
# them per environment (dev / staging / prod) and per tenant.

# --- Portugal (Fiskaly SIGN PT) ---
tms.compliance.pt.fiskaly.api-key=test-key
tms.compliance.pt.fiskaly.api-secret=test-secret
# Base URL of Fiskaly. Sandbox is test.api.fiskaly.com, prod is api.fiskaly.com.
tms.compliance.pt.fiskaly.base-url=https://test.api.fiskaly.com

# --- Angola (AGT) ---
# AGT uses HTTP Basic Auth with per-taxpayer credentials issued by AGT.
tms.compliance.ao.agt.username=demo-user
tms.compliance.ao.agt.password=demo-pass
# Sandbox: https://sifphml.minfin.gov.ao/sigt/fe/v1/
# Prod:     https://sifp.minfin.gov.ao/sigt/fe/v1/
tms.compliance.ao.agt.base-url=https://sifphml.minfin.gov.ao/sigt/fe/v1/

# --- Quarkus HTTP ---
quarkus.http.port=8080
quarkus.log.level=INFO

# --- Optional: per-tenant credential store ---
# In production, credentials are looked up by tenant NIF from a secrets store
# (Vault, Kubernetes secret, or a per-tenant config map), NOT from these flat
# properties. These flat values are only for the single-tenant skeleton.
